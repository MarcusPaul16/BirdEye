<header>
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
      <path d="M2 16s5-9 14-9 14 9 14 9-5 9-14 9S2 16 2 16Z" />
      <circle cx="16" cy="16" r="5.5" />
      <circle cx="16" cy="16" r="1.8" fill="currentColor" />
    </svg>
    <span>Bird<em>Eye</em></span>
  </div>
  <div class="right">
  <nav>
    <a routerLink="/portfolio" routerLinkActive="active">Portfolio</a>
    <a routerLink="/income" routerLinkActive="active">Income</a>
    <a routerLink="/valuations" routerLinkActive="active">Valuations</a>
    <a routerLink="/credits" routerLinkActive="active">Credits</a>
    <a routerLink="/companies" routerLinkActive="active">Companies</a>
  </nav>
  <button type="button" class="theme" (click)="theme.toggle()"
          [attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
          [title]="theme.theme() === 'dark' ? 'Light theme' : 'Dark theme'">
    @if (theme.theme() === 'dark') {
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2" />
        <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6" />
      </svg>
    } @else {
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.5 14.3A8.5 8.5 0 0 1 9.7 3.5a8.5 8.5 0 1 0 10.8 10.8Z" />
      </svg>
    }
  </button>
  </div>
</header>
<main><router-outlet /></main>
